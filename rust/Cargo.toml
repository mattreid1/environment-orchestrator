[package]
name = "environment-orchestrator"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
fs2 = "0.4"
futures-util = { version = "0.3", features = ["sink"] }
getrandom = "0.3"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
rusqlite = "0.38"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "signal", "time", "sync", "io-util", "fs"] }
tokio-tungstenite = "0.28"
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
